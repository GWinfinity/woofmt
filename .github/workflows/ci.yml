name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Build (default features — must be single binary)
        run: cargo build --locked

      - name: Build with benchmark feature
        run: cargo build --locked --features benchmark

      - name: Run tests
        run: cargo test --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --locked -- -D warnings

      - name: gofmt byte-level compatibility
        # Installs Go and compares `woofmt fmt` output with gofmt on the
        # corpus. Currently informational: failures are reported as
        # annotations but do not fail the build until coverage reaches 100%.
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run gofmt compat check (report-only until 100% gofmt parity)
        # The formatter is structurally gofmt-compatible but not yet
        # byte-identical on all constructs (docs/SEMVER_POLICY.md requires
        # >=95% corpus parity for 1.0). Diffs are printed as a ratchet:
        # the diff count must shrink over time, and this step flips to
        # blocking once the corpus is fully green.
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/gofmt_compat.sh
          ./scripts/gofmt_compat.sh ./target/debug/woofmt
        continue-on-error: true

      - name: Verify single-binary install (P2 regression guard)
        if: runner.os == 'Linux'
        run: |
          cargo install --path . --locked --root /tmp/woofmt-install-check
          ls /tmp/woofmt-install-check/bin
          test -f /tmp/woofmt-install-check/bin/woofmt
          if [ -f /tmp/woofmt-install-check/bin/benchmark_256core ]; then
            echo "REGRESSION: benchmark_256core leaked into default install"
            exit 1
          fi
